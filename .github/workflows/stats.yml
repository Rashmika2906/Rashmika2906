name: Update GitHub Stats
on:
  schedule:
   - cron: "0 3 * * *" 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
        - name: Checkout repository
          uses: actions/checkout@v6
        - name: Generate GitHub Stats
          uses: stats-organization/github-readme-stats-action@v2
          with:
            card: stats
            options: username=Rashmika2906&show_icons=true&hide_border=true&bg_color=00000000&title_color=EF93C4&icon_color=FF69B4&text_color=888888&rank_icon=github
            path: profile/stats.svg
            token: ${{ secrets.GITHUB_TOKEN }}
        - name: Generate Top Languages
          uses: stats-organization/github-readme-stats-action@v2
          with: 
            card: top-langs
            options: username=Rashmika2906&layout=compact&langs_count=6&hide_border=true&bg_color=00000000&title_color=EF93C4&text_color=888888
            path: profile/top-langs.svg
            token: ${{ secrets.GITHUB_TOKEN }}
        - name: Commit generated cards
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add profile/*.svg
            git commit -m "Update GitHub stats" || exit 0
            git push